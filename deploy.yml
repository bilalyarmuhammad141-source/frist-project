AWSTemplateFormatVersion: '2010-09-09'
Description: Simple Free Tier EC2 Instance with HTTP access.

Resources:
  # 1. Security Group to allow HTTP traffic
  WebServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow inbound HTTP traffic
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  # 2. Free Tier EC2 Instance
  MyEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro # Free Tier eligible (2 vCPUs, 1 GiB RAM for newer accounts)
      ImageId: ami-0c02fb55956c7d316 # Amazon Linux 2 AMI ID (Update based on your region)
      SecurityGroupIds:
        - !Ref WebServerSecurityGroup
      # Optional: Script to automatically start a basic HTTP web page
      UserData:
        Fn::Base64: |
          #!/bin/bash
          yum update -y
          yum install -y httpd
          systemctl start httpd
          systemctl enable httpd
          echo "<h1>Hello from your Free Tier EC2!</h1>" > /var/www/html/index.html

Outputs:
  PublicIP:
    Description: Public IP of the newly created EC2 instance
    Value: GetAtt MyEC2Instance.PublicIp
